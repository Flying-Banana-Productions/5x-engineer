name: Stage 5x-cli Release

on:
  push:
    tags:
      - "5x-cli-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing 5x-cli release tag to stage (for example, 5x-cli-v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: 5x-cli-npm-publish
  cancel-in-progress: false

jobs:
  stage:
    name: Stage npm package
    # Stays GitHub-hosted: npm trusted publishing and provenance do not
    # support self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Verify release tag and version
        working-directory: 5x-cli
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            5x-cli-v?*) ;;
            *)
              echo "release_tag must start with 5x-cli-v" >&2
              exit 1
              ;;
          esac
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "${RELEASE_TAG#5x-cli-v}"
      - name: Install dependencies
        working-directory: 5x-cli
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: 5x-cli
        run: bun run lint
      - name: Typecheck
        working-directory: 5x-cli
        run: bun run typecheck
      - name: Test
        working-directory: 5x-cli
        run: bun run test
      - name: Check npm package contents
        working-directory: 5x-cli
        run: npm pack --dry-run
      - name: Stage npm package
        working-directory: 5x-cli
        run: |
          set -euo pipefail
          # npm refuses a prerelease without an explicit dist-tag. Derive it from
          # the prerelease identifier (2.0.0-beta.1 -> beta) so only stable
          # versions move `latest`. The tag is immutable once staged.
          version="${RELEASE_TAG#5x-cli-v}"
          case "$version" in
            *-*)
              dist_tag="${version#*-}"
              dist_tag="${dist_tag%%.*}"
              ;;
            *) dist_tag="latest" ;;
          esac
          if ! printf '%s' "$dist_tag" | grep -Eq '^[a-z][a-z0-9-]*$'; then
            echo "cannot derive an npm dist-tag from version $version" >&2
            exit 1
          fi
          echo "Staging $version under dist-tag $dist_tag"
          npm stage publish --access public --tag "$dist_tag"
