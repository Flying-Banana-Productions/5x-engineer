[test]
# Bun ignores `[test] timeout` and keeps the 5000ms default (oven-sh/bun#7789).
# package.json's `test` script passes `--timeout 15000`, which is what applies.
preload = ["./test/setup.ts"]

# Test coverage
coverageThreshold = 0.8
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["**/tmp/**"]
