# 5x Configuration
# https://github.com/5x-engineer/5x-cli

# Maximum steps per automated run (safety guardrail)
maxStepsPerRun = 250

# Maximum review iterations before stopping
maxReviewIterations = 5

# Maximum quality gate retry attempts
maxQualityRetries = 3

# Maximum automated retries on failure
maxAutoRetries = 3

# Commands run after author implementation and before reviewer pass.
# Any failing command triggers quality-retry behavior.
qualityGates = [
  # "bun test",
  # "bun run lint",
  # "bun run build",
]

# Author agent configuration (default provider: opencode)
[author]
# provider = "opencode"
# Default model for `5x invoke` and fallback for `5x harness install` when no
# per-harness override is set for the harness you are installing.
# model = "anthropic/claude-sonnet-4-6"
# timeout = 900
#
# When true, enforce session continuity across steps within the same phase.
continuePhaseSessions = false

# Optional: different model id strings per harness (keys match `5x harness install <name>`).
[author.harnessModels]
# opencode = "anthropic/claude-sonnet-4-6"
# cursor = "claude-sonnet-4-6"
#

# Reviewer agent configuration (default provider: opencode)
[reviewer]
# provider = "opencode"
# model = "anthropic/claude-sonnet-4-6"
# timeout = 900
#
# When true, enforce session continuity across steps within the same phase.
continuePhaseSessions = true

[reviewer.harnessModels]
# opencode = "openai/gpt-5.4"
# cursor = "gpt-5.4"
#

# Optional hook run after creating a new worktree
[worktree]
# postCreate = "bun install"

# Paths are relative to repository root unless absolute
[paths]
plans = "docs/development"
reviews = "docs/development/reviews"
# planReviews = "docs/development/reviews/plans"
# runReviews = "docs/development/reviews/impl"
archive = "docs/archive"
records = "docs/development/runs"

[paths.templates]
plan = ".5x/templates/implementation-plan-template.md"
review = ".5x/templates/review-template.md"

# SQLite database location for run history and state
[db]
path = ".5x/5x.db"

# Delivery-budget forecasts during plan review (v2 area 206).
# mode: off | advisory | enforced (pinned to a run when its baseline is captured)
[reviewBudget]
mode = "advisory"
# growthPercent = 25
# minimumGrowthPoints = 2
# debtTradeoffRatio = 1.0
# maxDebtCreditPercent = 25
# absoluteGrowthPercent = 50
# baselineDisagreementPercent = 25
# minimumBaselineDisagreementPoints = 2
# maxPositiveArchitecturePercent = 25
# minimumPositiveArchitecturePoints = 2
# singleArchitectureReviewPoints = 5

# Git-tracked run records. `actor` is optional and appears in git history when set.
# Prefer FIVEX_RECORDS_ACTOR or user-scope identity.json over a committed actor.
# [records]
# redact = []
# actor = "your-label"

# Optional extra progress-resolution candidate after 5x/<slug> refs (before HEAD).
# Use this when plans live on a non-conventional branch.
# [plans]
# branch = "release/plans"
